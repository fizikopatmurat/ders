 peer.on('open',()=>{$('bs').textContent='Toplantıyı Bitir';$('bs').className='t';$('bl').hidden=0;note('Oda: '+room)});
 peer.on('call',c=>{c.answer(local);onCall(c)});
 peer.on('connection',c=>{c.perm={...defPerm};c.med={...defMed};conns.push(c);c.on('open',()=>{syncAll(c);c.send({k:'perm',p:c.perm});c.send({k:'media',a:c.med.a,v:c.med.v});if(scrS)scrCalls.push(peer.call(c.peer,scrS,{metadata:{t:'scr'}}))});c.on('data',m=>tMsg(c,m));c.on('close',()=>gone(c));c.on('error',()=>gone(c));watchIce(c)});
 peer.on('error',e=>note('Bağlantı hatası: '+e.type))}
function cpLink(){const u=location.href.split('#')[0]+'#oda='+room;navigator.clipboard?navigator.clipboard.writeText(u).then(()=>note('Bağlantı kopyalandı · Oda: '+room)):prompt('Bağlantı',u)}
async function joinRoom(){const nmv=($('nm').value.trim()||'Öğrenci').slice(0,30);try{localStorage.setItem('nm',nmv)}catch(_){}let r=$('rin').value.trim();if(r.includes('oda='))r=r.split('oda=')[1];if(!r)return;$('jm').textContent='Bağlanıyor…';
 local=await media();tile('self',local,1);try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(_){}
 peer=new Peer();peer.on('call',c=>{c.answer();onScr(c)});peer.on('error',e=>$('jm').textContent='Bağlanılamadı: '+e.type);
 peer.on('open',()=>{const c=peer.connect(r,{reliable:true});conns=[c];c.on('open',()=>{c.send({k:'hi',name:nmv});$('join').hidden=1;note('Bağlandı')});c.on('data',onMsg);c.on('close',()=>{note('Bağlantı koptu');toast('Bağlantı koptu')});onCall(peer.call(r,local))})}
function tg(k,b){const t=local&&local.getTracks().filter(x=>x.kind===k);if(!t||!t.length)return;const on=!t[0].enabled;t.forEach(x=>x.enabled=on);b.textContent=(k==='audio'?'Mikrofon: ':'Kamera: ')+(on?'Açık':'Kapalı')}
async function swCam(){if(!local||!navigator.mediaDevices)return;const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');if(d.length<2)return note('Başka kamera bulunamadı');
 const o=local.getVideoTracks()[0],i=d.findIndex(x=>o&&x.deviceId===o.getSettings().deviceId);
 const n=(await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:d[(i+1)%d.length].deviceId}}})).getVideoTracks()[0];
 if(o){local.removeTrack(o);o.stop()}local.addTrack(n);calls.forEach(c=>{const s=c.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='video');s&&s.replaceTrack(n)});tile('self',local,1)}
/* kamera çerçevesini sürükle */
(()=>{const t=$('tiles');let g=0,dx,dy;t.onpointerdown=e=>{g=1;const r=t.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;t.setPointerCapture(e.pointerId)};
 t.onpointermove=e=>{if(g){t.style.right=t.style.bottom='auto';t.style.left=(e.clientX-dx)+'px';t.style.top=(e.clientY-dy)+'px'}};t.onpointerup=()=>g=0})();
</script></body></html>
